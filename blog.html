<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="website for Ceramic soul brand" />
    <meta name="author" content="Awesome student" />
    <title>Blog</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="blog">
      <div class="container">
        <div class="header">
          <div class="header__menu header__menu_active">
            <div class="header__menu-close">
              <span></span>
              <span></span>
            </div>
            <nav class="header__menu-nav">
              <ul>
                <li><a href="#" class="header__menu-link">catalog</a></li>
                <li><a href="#" class="header__menu-link">blog</a></li>
                <li><a href="#" class="header__menu-link">about</a></li>
              </ul>
            </nav>
          </div>
          <div class="header__top">
            <div class="burger">
              <span></span>
              <span></span>
              <span></span>
            </div>
            <a href="#" class="header__logo">
              <img src="/src/logo/logo-150x151.png" alt="logo" />
            </a>
            <div class="header__icons">
              <a href="#"><span class="icon-search"></span></a>
              <a href="#"><span class="icon-shopping-bag"></span></a>
            </div>
          </div>
          <nav class="header__nav">
            <ul>
              <li>
                <a class="header__link" href="#">catalog</a>
              </li>
              <li>
                <a class="header__link" href="#">blog</a>
              </li>
              <li>
                <a class="header__link" href="#">about</a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="container">
        <div class="footer__wrapper pure-g">
          <div class="footer__form">
            <h3 class="title-h4 footer__title-color">newsletter</h3>
            <p class="footer__form-text">
              Keep up to date with news and promotions
            </p>
            <form action="#">
              <fieldset class="footer__form-fieldset">
                <input
                  type="email"
                  id="e-mail"
                  name="e-mail"
                  placeholder="Enter yuor e-mail"
                  class="footer__input"
                  required
                />
              </fieldset>
              <label for="footer-checkbox" class="footer__form-consent">
                <input
                  type="checkbox"
                  id="footer-checkbox"
                  name="footer-checkbox"
                  class="footer__form-checkbox"
                  required
                />
                I agree with the terms
                <a href="#" class="footer__form-link">terms</a>
              </label>
              <button class="btn-submit footer__form-btn">submit</button>
            </form>
          </div>
          <div class="footer__nav-wrapper pure-g">
            <div class="footer__nav-block">
              <h3 class="title-h4 footer__title-color">discover</h3>
              <ul>
                <li>
                  <a href="#" class="footer__nav-link">About Us</a>
                </li>
                <li>
                  <a href="#" class="footer__nav-link">Blog</a>
                </li>
              </ul>
            </div>
            <div class="footer__nav-block">
              <h3 class="title-h4 footer__title-color">shopping</h3>
              <ul>
                <li>
                  <a href="#" class="footer__nav-link">Catalog</a>
                </li>
              </ul>
            </div>
            <div class="footer__nav-block">
              <h3 class="title-h4 footer__title-color">information</h3>
              <ul>
                <li>
                  <a href="#" class="footer__nav-link">Terms and Conditions</a>
                </li>
              </ul>
            </div>
          </div>
          <div class="footer__social pure-u-1">
            <h3 class="title-h4 footer__title-color">follow us</h3>
            <div class="footer__social-links">
              <a href="#"
                ><span class="icon-facebook footer__social-icon"></span
              ></a>
              <a href="#"
                ><span class="icon-instagram footer__social-icon"></span
              ></a>
              <a href="#"
                ><span class="icon-pinterest-circled footer__social-icon"></span
              ></a>
            </div>
          </div>
        </div>
        <p class="footer__legal-copyright">© Copyright 2025, Ceramic soul</p>
      </div>
    </footer>
    <script type="module" src="/src/js/script.js"></script>
  </body>
</html>
